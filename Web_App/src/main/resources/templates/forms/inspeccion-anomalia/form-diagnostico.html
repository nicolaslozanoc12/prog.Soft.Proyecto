<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
	<h3>Diagnostico de equipo</h3>
	<p>complete la tarea y oprima el Boton.</p>


	<form method="post" th:action="@{/tarea/{id}/completar(id=${taskId})}">
		<input type="hidden" name="groupName" th:value="${groupName}" />
		<input type="hidden" name="processKey" th:value="${processKey}" />
		<input type="hidden" id="horaDiagnosticoCompletada" name="horaDiagnosticoCompletada" />
		<label for="diagnosticoCompletado">Descripción del diagnóstico:</label><br>
		<textarea id="diagnosticoCompletado" name="diagnosticoCompletado" rows="4" cols="50" required></textarea><br><br>
		<button type="submit">Diagnostico completado</button>
	</form>
	<script>
        //escuchador al formulario
        document.getElementById('horaDiagnosticoCompletada').addEventListener('change', function() {
            var fechaActual = new Date();
            //cuando se cambie el valor del input, se actualiza el valor del input hidden
            document.getElementById('horaDiagnosticoCompletada').value = fechaActual.toString();
        });
	</script>

</div>
</body>
</html>
