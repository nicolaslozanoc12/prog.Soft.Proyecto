<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
	<h3>Verificar Solución</h3>
	<p>Por favor, revise la siguiente información y confirme la solucion .</p>

	<h4>Detalles de la Alerta:</h4>
	<ul>
		<li><b>ID de la Línea:</b> <span th:text="${variables.idLinea.value}"></span></li>
		<li><b>Descripcion anomalia:</b> <span th:text="${variables.descripcionAnomalia.value}"></span></li>
		<li><b>Diagnostico:</b> <span th:text="${variables.diagnosticoCompletado.value}"></span> Tiempo:<span th:text="${variables.horaDiagnosticoCompletada.value}"></span></li>
		<li><b>Reparación:</b> <span th:text="${variables.reparacionCompletada.value}"></span> Tiempo:<span th:text="${variables.horaReparacionCompletada.value}"></span></li>
		<li><b>Mantenimiento:</b> <span th:text="${variables.mantenimientoCompletado.value}"></span> Tiempo:<span th:text="${variables.horaMantenimientoCompletado.value}"></span></li>
		<li><b>Prueba:</b> <span th:text="${variables.pruebaCompletada.value}"></span> Tiempo:<span th:text="${variables.horapruebaCompletada.value}"></span></li>
	</ul>

	<form method="post" th:action="@{/tarea/{id}/completar(id=${taskId})}">
		<input type="hidden" name="groupName" th:value="${groupName}" />
		<input type="hidden" name="processKey" th:value="${processKey}" />
		<label for="verificarSolucion">se soluciono la anomalia(marque si es verdad):</label>
		<input type="checkbox" id="verificarSolucion" name="verificarSolucion" value="true" required><br>
		<button type="submit">Completar verificación de solución</button>
	</form>
</div>
</body>
</html>
