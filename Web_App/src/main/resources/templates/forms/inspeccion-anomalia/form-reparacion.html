<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
	<h3>Reparación de equipo</h3>
	<p>complete la tarea y oprima el Boton.</p>


	<form method="post" th:action="@{/tarea/{id}/completar(id=${taskId})}">
		<input type="hidden" name="groupName" th:value="${groupName}" />
		<input type="hidden" name="processKey" th:value="${processKey}" />
		<input type="hidden" id="horaReparacionCompletada" name="horaReparacionCompletada" />
		<label for="reparacionCompletada">Descripción de la reparación:</label><br>
		<textarea id="reparacionCompletada" name="reparacionCompletada" rows="4" cols="50" required></textarea><br><br>
		<button type="submit">reparación completada</button>
	</form>

	<script>
        //escuchador al formulario
        document.getElementById('horaReparacionCompletada').addEventListener('change', function() {
            var fechaActual = new Date();
            //cuando se cambie el valor del input, se actualiza el valor del input hidden
            document.getElementById('horaReparacionCompletada').value = fechaActual.toISOString();
        });
	</script>
</div>
</body>
</html>
